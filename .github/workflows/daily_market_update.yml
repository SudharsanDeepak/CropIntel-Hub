name: Automated Daily Market Data Fetcher

on:
  schedule:
    # Runs everyday at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-market-data:
    name: Fetch and Store Daily Prices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wake up Deployed Services & Trigger ML API Update
        run: |
          echo "🌐 Pinging backend and ML service on Render..."
          # Wake up Render instances
          curl -s --max-time 60 https://cropintel-hub-bnd.onrender.com/health || true
          curl -s --max-time 60 https://cropintel-hub-ml.onrender.com/health || true

          echo "🚀 Triggering Daily Comprehensive Market Data Update..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "https://cropintel-hub-ml.onrender.com/data/update?days=7&api_key=cropintelhub_admin" \
            -H "X-API-Key: cropintelhub_admin" \
            --max-time 180 || true)
          
          echo "Response: $RESPONSE"

      - name: Setup Python for Direct MongoDB Fallback
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'AIML Project - ML Model/requirements.txt'

      - name: Install Dependencies
        working-directory: './AIML Project - ML Model'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Market Update directly to MongoDB Atlas
        working-directory: './AIML Project - ML Model'
        env:
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb://SudharsanDeepak:sudharsan@ac-5b17cgz-shard-00-00.g6tkwcc.mongodb.net:27017,ac-5b17cgz-shard-00-01.g6tkwcc.mongodb.net:27017,ac-5b17cgz-shard-00-02.g6tkwcc.mongodb.net:27017/market_analyzer?authSource=admin&replicaSet=atlas-sf9w08-shard-0&retryWrites=true&w=majority&tls=true' }}
          AGMARKNET_API_KEY: ${{ secrets.AGMARKNET_API_KEY || '579b464db66ec23bdd0000012ad0cf40e5984c1152c50351b4ef147f' }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY || 'J5v4ZF527NVort6CJV6UyKcmSdeczzfIn8DNBzBRbrU=' }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY || '2111ae079aae0957ab1142d29bfa54b0' }}
        run: |
          python daily_market_update.py
